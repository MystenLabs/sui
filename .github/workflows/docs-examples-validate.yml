name: Validate Docs Examples

on:
  push:
    branches: [main]
    paths:
      - 'docs/content/**'

jobs:
  check-import-content:
    name: Check for ImportContent changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for ImportContent changes in diff
        id: check
        run: |
          DIFF=$(git diff HEAD~1 HEAD -- 'docs/content/**/*.mdx' 'docs/content/**/*.md' \
            | grep -E '^\+.*<ImportContent|^-.*<ImportContent' || true)
          if [ -n "$DIFF" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "ImportContent changes detected:"
            echo "$DIFF"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No ImportContent changes — skipping validation"
          fi

  trigger-validation:
    name: Trigger example validator
    needs: check-import-content
    if: needs.check-import-content.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validator workflow
        run: |
          gh workflow run validate.yml \
            --repo jessiemongeon1/sui-docs-example-validator \
            --ref main \
            -f sui_branch=main \
            -f mode=strict
        env:
          GH_TOKEN: ${{ secrets.VALIDATOR_DISPATCH_TOKEN }}
