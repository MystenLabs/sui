name: Simulator Tests

concurrency:
  group: ${{ github.workflow }}

on:
  schedule:
    - cron: '0 9 * * *' # equivalent to 1am PST
    - cron: '0 21 * * *' # equivalent to 1pm PST
  workflow_dispatch:
    inputs:
      sui_ref:
        description: "Branch / commit to test"
        type: string
        required: true
        default: main
      test_num:
        description: "Number of seeds to run (seed-search iterations)"
        type: string
        required: false
        default: "30"
      protocol_config_override:
        description: "Protocol config override"
        type: string
        required: false
        default: ""

env:
  SUI_REF: "${{ github.event.inputs.sui_ref || 'main' }}"
  TEST_NUM: "${{ github.event.inputs.test_num || '30' }}"
  SIMTEST_MIN_FREE_GB: "100"

# A GitHub-hosted job is hard-capped at 6 hours and the full nightly (seed
# search, then stress and determinism) now takes longer than that, so the run
# is split into two sequential jobs that each SSH into simtest-01 and run a
# subset of the phases in scripts/simtest/simtest-run.sh (SIMTEST_PHASES).
# Both jobs pass the same SIMTEST_RUN_ID, so they share one log directory
# (~/simtest_logs/<run id>/) and one seed base, and the finalize job collects
# failures from that directory once for the notification.
#
# The SSH plumbing shared by the jobs lives in .github/actions/simtest-*:
# the Teleport session, the wait-for-idle-host loop, and the start (as a
# transient systemd unit) / poll / check sequence for one phase job. Each job
# checks out .github/actions to load them; the sui tree under test is cloned
# on the host.
#
# Host files, per phase: ~/simtest_<phase>_stdout.log and
# ~/simtest_<phase>_exit_code, where <phase> is seed-search or
# stress-determinism. ~/simtest_active_run marks the host as busy for the
# whole run.
jobs:
  seed-search:
    name: Seed search
    # Allow running the job for up to 6 hours, maximum for GitHub Actions.
    timeout-minutes: 360
    permissions:
      # The "id-token: write" permission is required or Machine ID will not be
      # able to authenticate with the cluster.
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          sparse-checkout: .github/actions
      - name: Teleport session
        id: teleport
        uses: ./.github/actions/simtest-teleport

      # Clean tmpfs, old repo, and old simtest logs before starting fresh.
      #
      # Consolidated into a single SSH call: each additional `tsh ssh`
      # spin-up has been hitting an intermittent
      # "cannot relogin in non-interactive session" failure on the
      # *second* (and beyond) call within the same step. One handshake
      # = one chance to flake.
      #
      # The systemctl stop / pkill block kills any stale simtest run from a
      # prior nightly that was cancelled mid-run and left running on the
      # host (as a transient simtest-* unit, or detached the old way) —
      # otherwise the survivor's in-flight cargo/test processes race
      # our re-clone, exec test binaries we're about to delete, and
      # corrupt the shared stdout logs via a leaked fd.
      - name: Environment clean
        run: |
          # The character classes ([ ], [e]) below are deliberate: pkill -f
          # matches against the full command line, which includes our own
          # remote bash's command line — and that command line contains the
          # literal pattern as text. A char class is a regex metasequence
          # that still matches the intended live process (cargo-simtest
          # simtest with a real space, target/simulator/deps/ with a real
          # 'e') but does NOT match the literal text "[ ]" / "[e]" in our
          # own shell, so pkill can no longer SIGKILL its own parent.
          tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 "set -e; \
            echo teleport OK; \
            sudo systemctl stop 'simtest-*.service' 2>/dev/null || true; \
            pkill -9 -f 'scripts/simtest/(simtest-run|seed-search)' || true; \
            pkill -9 -f 'cargo-simtest[ ]simtest' || true; \
            pkill -9 -f 'target/simulator/d[e]ps/' || true; \
            sleep 3; \
            rm -f ~/simtest_active_run ~/simtest_*_exit_code ~/simtest_*_exit_code.tmp; \
            sudo rm -rf /tmp/* 2>/dev/null || true; \
            rm -rf ~/sui; \
            (cd ~/simtest_logs && ls -dt */ 2>/dev/null | tail -n +11 | xargs -r rm -rf) || true"

      # Guard free space at the point of maximum free space — right after
      # cleanup and before the clone/install/build that actually consume it.
      # Checking here (rather than just before the run) means an already-full
      # host fails with df/du diagnostics instead of a raw `git clone` or
      # install.sh error that buries the real cause.
      - name: Check simtest host disk space after cleanup
        run: |
          min_free_gb=${{ env.SIMTEST_MIN_FREE_GB }}
          tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 "set -e; \
            free_gb=\$(df -BG / | awk 'NR == 2 { gsub(/G/, \"\", \$4); print \$4 }'); \
            echo \"simtest-01 root filesystem has \${free_gb}G free; required floor is ${min_free_gb}G\"; \
            if [ \"\${free_gb}\" -lt \"${min_free_gb}\" ]; then \
              echo '::error::simtest-01 does not have enough free disk space to start simulator tests'; \
              df -h / /home /tmp; \
              du -xh -d1 /home/ubuntu 2>/dev/null | sort -h | tail -20 || true; \
              exit 1; \
            fi"

      # Checkout out the latest sui repo
      - name: Checkout sui repo
        run: |
          tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 "source ~/.bashrc && source ~/.cargo/env && cd ~/ && git clone git@github.com:MystenLabs/sui.git && cd ~/sui && git fetch origin && git checkout ${{ env.SUI_REF }}"

      # Setting up cargo and simtest
      - name: Install simtest
        run: |
          tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 "source ~/.bashrc && source ~/.cargo/env && cd ~/sui && ./scripts/simtest/install.sh"

      - name: Set protocol config override based on trigger
        id: protocol
        # This step determines which protocol config override to use.
        # It checks if the trigger was a manual dispatch or a specific schedule.
        run: |
          message=""
          override=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ github.event.inputs.protocol_config_override }}" ]]; then
              echo "Testing with protocol config override: ${{ github.event.inputs.protocol_config_override }}"
              override="${{ github.event.inputs.protocol_config_override }}"
            else
              echo "Testing latest protocol config for dispatched run"
            fi
          elif [[ "${{ github.event.schedule }}" == "0 21 * * *" ]]; then
            echo "Testing mainnet protocol config"
            override="mainnet"
            message="(mainnet config) "
          else
            echo "Testing latest protocol config"
          fi
          # Set the outputs for the phase actions and the other jobs to use.
          echo "protocol_message=${message}" >> $GITHUB_OUTPUT
          echo "protocol_config_override=${override}" >> $GITHUB_OUTPUT

      # The run id names the shared log directory and seeds both jobs.
      - name: Choose run id
        id: run
        run: |
          run_id=$(date +%s)
          echo "run_id=${run_id}" >> $GITHUB_OUTPUT
          echo "log_dir=/home/ubuntu/simtest_logs/${run_id}" >> $GITHUB_OUTPUT
          # The workspace on the host is ready: the stress-determinism and
          # finalize jobs may run even if seed search itself fails.
          echo "workspace_ready=true" >> $GITHUB_OUTPUT

      - name: Run seed search
        uses: ./.github/actions/simtest-run-phase
        with:
          identity-file: ${{ steps.teleport.outputs.identity-file }}
          phase: seed-search
          phases: seed-search
          run-id: ${{ steps.run.outputs.run_id }}
          log-dir: ${{ steps.run.outputs.log_dir }}
          protocol-config-override: ${{ steps.protocol.outputs.protocol_config_override }}
          test-num: ${{ env.TEST_NUM }}
          min-free-gb: ${{ env.SIMTEST_MIN_FREE_GB }}

      # The finalize job clears the marker once both phases are done. Only
      # clear it here when the workspace was never set up, i.e. a setup step
      # failed and the later jobs will not run. Skip on cancellation: the
      # simtest runs as a transient systemd unit on the host, so a cancelled
      # Actions run leaves it alive. Clearing the marker here would falsely
      # advertise the host as idle while a run is still in flight. The next
      # nightly's "Environment clean" step pkills the survivor and removes the
      # marker together, so leaving it on cancel is safe.
      - name: Clear simtest active marker
        if: always() && !cancelled() && steps.run.outputs.workspace_ready != 'true'
        run: |
          tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 "rm -f ~/simtest_active_run" || true

    outputs:
      workspace_ready: ${{ steps.run.outputs.workspace_ready }}
      run_id: ${{ steps.run.outputs.run_id }}
      log_dir: ${{ steps.run.outputs.log_dir }}
      protocol_message: ${{ steps.protocol.outputs.protocol_message }}
      protocol_config_override: ${{ steps.protocol.outputs.protocol_config_override }}

  stress-determinism:
    name: Stress and determinism
    needs: [seed-search]
    # Runs after seed search test failures, but not after cancellation or a
    # failed clone/install.
    if: ${{ !cancelled() && needs.seed-search.outputs.workspace_ready == 'true' }}
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          sparse-checkout: .github/actions
      - name: Teleport session
        id: teleport
        uses: ./.github/actions/simtest-teleport

      # Seed search may still be running on the host if its job lost track of
      # it. Wait for it instead of racing it for the build directory.
      - name: Wait for seed search to finish on host
        uses: ./.github/actions/simtest-wait-host-idle
        with:
          identity-file: ${{ steps.teleport.outputs.identity-file }}

      - name: Check that the seed-search job's clone and install are in place
        run: |
          tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 "source ~/.bashrc && source ~/.cargo/env && cd ~/sui && git rev-parse HEAD && command -v cargo-simtest"

      # Reuses ~/sui, the cargo-simtest install and the build left by the
      # seed-search job; only the stress and determinism phases run, into the
      # same log directory.
      - name: Run stress and determinism
        uses: ./.github/actions/simtest-run-phase
        with:
          identity-file: ${{ steps.teleport.outputs.identity-file }}
          phase: stress-determinism
          phases: stress,determinism
          run-id: ${{ needs.seed-search.outputs.run_id }}
          log-dir: ${{ needs.seed-search.outputs.log_dir }}
          protocol-config-override: ${{ needs.seed-search.outputs.protocol_config_override }}
          test-num: ${{ env.TEST_NUM }}
          min-free-gb: ${{ env.SIMTEST_MIN_FREE_GB }}

  # Runs once both phases are done (or the second one was skipped after a
  # cancellation-free failure): collects failures from the shared log
  # directory once and clears the active marker.
  finalize:
    name: Finalize
    needs: [seed-search, stress-determinism]
    if: ${{ !cancelled() && needs.seed-search.outputs.workspace_ready == 'true' }}
    # Mostly idle, but may have to wait out a stress run the previous job lost
    # track of.
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          sparse-checkout: .github/actions
      - name: Teleport session
        id: teleport
        uses: ./.github/actions/simtest-teleport

      # Either phase job may have lost track of its detached run while the run
      # is still going on the host. Wait for it before collecting logs or
      # declaring the host idle.
      - name: Wait for any remaining simtest run on host
        uses: ./.github/actions/simtest-wait-host-idle
        with:
          identity-file: ${{ steps.teleport.outputs.identity-file }}

      - name: Collect failing tests
        id: failures
        if: needs.seed-search.result == 'failure' || needs.stress-determinism.result == 'failure'
        run: |
          LOG_DIR="${{ needs.seed-search.outputs.log_dir }}"
          FAILED_TESTS=$(tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 \
            "cd ~/sui && ./scripts/simtest/collect-failures.py '$LOG_DIR' | head -20")
          echo "failed_tests<<EOF" >> $GITHUB_OUTPUT
          echo "$FAILED_TESTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "log_dir=$LOG_DIR" >> $GITHUB_OUTPUT

      - name: Clear simtest active marker
        run: |
          tsh -i ${{ steps.teleport.outputs.identity-file }} ssh ubuntu@simtest-01 "rm -f ~/simtest_active_run" || true

    outputs:
      failed_tests: ${{ steps.failures.outputs.failed_tests }}
      log_dir: ${{ steps.failures.outputs.log_dir }}

  notify:
    name: Notify
    needs: [seed-search, stress-determinism, finalize]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'schedule' && (needs.seed-search.result == 'failure' || needs.stress-determinism.result == 'failure' || needs.finalize.result == 'failure') }}

    steps:
    - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # Pin v4.1.1

    - name: Dispatch to sui-operations for notification
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # pin@v4.0.1
      with:
        token: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
        repository: MystenLabs/sui-operations
        event-type: simtest-failure
        client-payload: |-
          {
            "commit_sha": "${{ github.sha }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "run_id": "${{ github.run_id }}",
            "workflow_name": "${{ github.workflow }}",
            "workflow_conclusion": "${{ env.WORKFLOW_CONCLUSION }}",
            "protocol_message": "${{ needs.seed-search.outputs.protocol_message }}",
            "failed_tests": ${{ toJSON(needs.finalize.outputs.failed_tests) }},
            "log_dir": "${{ needs.finalize.outputs.log_dir }}"
          }
