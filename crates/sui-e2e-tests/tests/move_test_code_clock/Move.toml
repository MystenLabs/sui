# Separate from `move_test_code` because `clock::now_ms` only exists in the
# protocol 139 framework, and some tests publish `move_test_code` on older frameworks.
[package]
name = "move_test_code_clock"
version = "0.0.1"
edition = "2024.beta"

[dependencies]
Sui = { local = "../../../sui-framework/packages/sui-framework" }

[addresses]
move_test_code_clock = "0x0"
