syntax = "proto3";
package sui.forking.v1alpha;

// Administrative service for controlling a forked Sui network.
service ForkingService {
  // Advance the forked network's clock by a given duration.
  rpc AdvanceClock(AdvanceClockRequest) returns (AdvanceClockResponse);

  // Seal pending transactions into a new checkpoint.
  rpc AdvanceCheckpoint(AdvanceCheckpointRequest) returns (AdvanceCheckpointResponse);

  // Return the current state of the forked network.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Seed an address-owned object at its fork-checkpoint version, as `--object` does at startup.
  rpc SeedObject(SeedObjectRequest) returns (SeedObjectResponse);

  // Seed every object an address owned at the fork checkpoint, together with its address balances,
  // as `--address` does at startup. Requires the fork checkpoint to be inside the remote's
  // consistent window, which is roughly the last hour.
  rpc SeedAddress(SeedAddressRequest) returns (SeedAddressResponse);

  // Seed the dynamic fields a parent held at the fork checkpoint, as `--dynamic-fields-of` does at
  // startup. Outside the remote's consistent window the fields are reconstructed from the parent's
  // version history.
  rpc SeedDynamicFieldsOf(SeedDynamicFieldsOfRequest) returns (SeedDynamicFieldsOfResponse);
}

message AdvanceClockRequest {
  // Duration in milliseconds to advance the clock. Defaults to 1 if unset.
  optional uint64 duration_ms = 1;
}

message AdvanceClockResponse {
  // Clock timestamp after advancing (milliseconds since Unix epoch).
  uint64 timestamp_ms = 1;

  // Digest of the ConsensusCommitPrologue transaction that advanced the clock.
  string tx_digest = 2;
}

message AdvanceCheckpointRequest {}

message AdvanceCheckpointResponse {
  // Sequence number of the newly created checkpoint.
  uint64 checkpoint_sequence_number = 1;

  // Timestamp embedded in the checkpoint (milliseconds since Unix epoch).
  uint64 timestamp_ms = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  // Current epoch of the forked network.
  uint64 epoch = 1;

  // Latest checkpoint sequence number.
  uint64 checkpoint_sequence_number = 2;

  // Current clock timestamp (milliseconds since Unix epoch).
  uint64 timestamp_ms = 3;

  // The upstream checkpoint at which the fork was created.
  uint64 forked_at_checkpoint = 4;
}

message SeedObjectRequest {
  // ID of the object to seed.
  optional string object_id = 1;
}

message SeedObjectResponse {
  SeedOutcome outcome = 1;
}

message SeedAddressRequest {
  // Address whose owned objects and balances to seed.
  optional string address = 1;
}

message SeedAddressResponse {
  SeedOutcome outcome = 1;
}

message SeedDynamicFieldsOfRequest {
  // ID of the parent whose dynamic fields to seed.
  optional string parent = 1;
}

message SeedDynamicFieldsOfResponse {
  SeedOutcome outcome = 1;
}

// What a seed request changed in the fork.
//
// Seeding never overrides local state. An object the fork already indexes, or one that local
// execution changed or removed since the fork, is reported as already present and left unchanged.
message SeedOutcome {
  // Objects added to the fork at their fork-checkpoint versions.
  repeated SeededObject seeded = 1;

  // IDs of resolved objects the fork already holds and left unchanged.
  repeated string already_present = 2;
}

message SeededObject {
  string object_id = 1;
  uint64 version = 2;
  string digest = 3;
}
