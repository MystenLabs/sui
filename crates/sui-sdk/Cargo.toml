[package]
name = "sui-sdk"
version.workspace = true
authors = ["Mysten Labs <build@mystenlabs.com>"]
license = "Apache-2.0"
publish = false
edition = "2024"

# This needs to be specified, in addition to the same setting
# in the workspace Cargo.toml.
[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_with.workspace = true
futures.workspace = true
bcs.workspace = true
thiserror.workspace = true
tracing.workspace = true

shared-crypto.workspace = true
sui-config.workspace = true
sui-crypto.workspace = true
sui-keys.workspace = true
sui-rpc.workspace = true
sui-rpc-api.workspace = true
sui-sdk-types.workspace = true
sui-types.workspace = true

# NOTE: It's important to keep the above dependency list short.
# This crate is widely used to develop on Sui and it's valuable
# to not have to pull in the entire sui repo for it.

[dev-dependencies]
fastcrypto.workspace = true
sui-macros.workspace = true
sui-simulator.workspace = true
tempfile.workspace = true
test-cluster.workspace = true
tokio.workspace = true
