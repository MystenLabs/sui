#
# The committee of sui-operations' Antithesis cluster
# (docker/sui-antithesis/genesis/compose-validators.yaml): four validators
# of equal stake, two-minute epochs. The validators' keys are fixed, so that
# `sui genesis` makes the same genesis every time. The gas accounts are
# sui.keystore's keys: one per stress client, since a client merges all of its
# account's coins at startup.
accounts:
  - address: '0x9b1b191f7df4f55c0f73e7638606ca4029fd52a2735b98f2d5674038affe3481'
    gas_amounts:
      - 750000000000000000
      - 750000000000000000
  - address: '0xcee102dc40813de1ba3f4c6e4751c0b0453047c1385e8c0feb10c201301f0e19'
    gas_amounts:
      - 750000000000000000
      - 750000000000000000
parameters:
  # DERP guests' clock starts at 1_800_000_000 s; a genesis made natively would
  # otherwise start at the host's time.
  chain_start_timestamp_ms: 1800000000000
  allow_insertion_of_extra_objects: false
  epoch_duration_ms: 120000
validator_config_info:
  - &validator
    name: validator1
    key_pair: PsYCiO/ANC8EpPIj862w+ay2tQwie7PqpdQGfh4CnNs=
    worker_key_pair: +QR6cqzhvEE4DB0B5wiavsGDMmiyBSw4nNbb14QFSJo=
    account_key_pair: AL8uGYE2QSvMuTg9/F595DEcvc7hEdVz4GCpPZ6QRUBE
    network_key_pair: y7ZJgM5efVX+7QtkxIRKkiJabIBRghMgmZQrwhmNz68=
    commission_rate: 0
    gas_price: 1000
    stake: 20000000000000000
    consensus_address: /ip4/127.0.0.1/tcp/8083/http
    network_address: /dns/validator1/tcp/8080/http
    narwhal_primary_address: /dns/validator1/udp/8081
    narwhal_worker_address: /dns/validator1/udp/8082
    p2p_address: /dns/validator1/udp/8084
